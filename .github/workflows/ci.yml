name: check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        leg: [lint, unit, go, e2e]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Set up Go
        if: matrix.leg == 'go' || matrix.leg == 'e2e'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache Playwright browsers
        if: matrix.leg == 'e2e'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: matrix.leg == 'e2e'
        run: npx playwright install chromium --with-deps

      - name: Run lint
        if: matrix.leg == 'lint'
        run: npm run check

      - name: Run unit tests
        if: matrix.leg == 'unit'
        run: npm run test:unit

      - name: Run Go tests
        if: matrix.leg == 'go' || matrix.leg == 'e2e'
        # assets_test.go and router_test.go validate the embedded dist/
        # produced by Vite. `npm run build` populates dist/, then
        # `go test ./...` exercises the actual embed. Without the build
        # first, tests asserting on served static assets 404 against the
        # tracked dist/.gitkeep placeholder.
        run: npm run build && go test ./...

      - name: Run E2E tests
        if: matrix.leg == 'e2e'
        # Parallel Chromium instances oversubscribed the runner's CPU, causing
        # arbitrary timing-sensitive assertions to intermittently miss their
        # margin under contention (a different suite each run). Run fully
        # sequential (tests/run.js defaults CONCURRENCY to 1) instead of
        # tuning the parallelism down further.
        run: npm run test:e2e
